services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marimo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marimo"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - marimo-db:/var/lib/postgresql/data

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marimo
    restart: unless-stopped

volumes:
  marimo-db:
