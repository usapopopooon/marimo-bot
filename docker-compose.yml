services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marimo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marimo"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - marimo-db:/var/lib/postgresql/data

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marimo
      DATABASE_REQUIRE_SSL: "false"
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      WATER_XP: ${WATER_XP:-10}
      XP_WEBHOOK_URL: ${XP_WEBHOOK_URL:-}
      XP_WEBHOOK_TOKEN: ${XP_WEBHOOK_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

volumes:
  marimo-db:
